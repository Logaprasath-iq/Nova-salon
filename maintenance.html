<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>Maintenance - NOVA Salon & Spa</title>

  <!-- CSS Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            stone: {
              150: '#E7E5E4',
              350: '#A8A29E',
              450: '#78716C',
              455: '#78716C',
              550: '#57534E',
              850: '#1C1917',
              855: '#1C1917'
            },
            brand: {
              gold: '#D4AF37',
              goldDark: '#AA8C2C',
              rose: '#D9A38F',
              roseDark: '#B76E79',
              cream: '#FDFBF7',
              creamDark: '#F5EFE6',
              darkBg: '#0F0F11',
              darkCard: '#1A1A1F',
              darkBorder: 'rgba(255,255,255,.08)',
              darkText: '#A1A1AA'
            }
          },
          screens: { lg: '992px' },
          zIndex: { 60: '60' },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-brand-cream text-stone-850 dark:bg-brand-darkBg dark:text-brand-darkText font-sans transition-colors duration-300 min-h-screen flex items-center justify-center relative px-4 sm:px-6 py-24">

  <!-- Background Image Overlay -->
  <div class="absolute inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&q=80&w=1920" class="absolute inset-0 w-full h-full object-cover" alt="Maintenance Background">
    <div class="absolute inset-0 bg-stone-950/70 dark:bg-stone-950/80"></div>
  </div>


  <div class="utility-controlbar absolute top-6 right-4 sm:right-8 z-10 flex items-center gap-2">
    <button type="button" class="theme-toggle w-10 h-10 rounded-full bg-brand-gold hover:bg-brand-goldDark text-stone-950 flex items-center justify-center transition-all" aria-label="Toggle Theme">
      <i class="fa-solid fa-moon dark:hidden text-sm"></i>
      <i class="fa-solid fa-sun hidden dark:block text-sm"></i>
    </button>
    <button type="button" class="rtl-ltr-toggle h-10 px-3 border border-white/20 text-white hover:border-brand-gold hover:text-brand-gold rounded-full text-[10px] font-semibold uppercase tracking-wider flex items-center gap-1.5 transition-all" aria-label="Toggle Direction">
      <i class="fa-solid fa-right-left text-xs"></i> <span class="dir-text">LTR</span>
    </button>
  </div>

  <!-- Maintenance Card (Glassmorphic) -->
  <div class="utility-card relative z-10 max-w-xl w-full glass-light dark:glass-dark rounded-3xl p-6 sm:p-8 md:p-12 shadow-2xl text-center space-y-8" data-aos="fade-up">
    <div class="w-24 h-24 bg-brand-gold/10 text-brand-gold rounded-full flex items-center justify-center mx-auto text-4xl animate-float">
      <i class="fa-solid fa-screwdriver-wrench"></i>
    </div>

    <div class="space-y-3">
      <a href="index.html" class="font-serif text-4xl font-bold tracking-widest text-brand-gold">NOVA</a>
      <span class="text-xs text-brand-rose uppercase tracking-widest font-bold block">Maintenance Mode</span>
      <h1 class="font-serif text-3xl md:text-4xl font-bold text-stone-900 dark:text-white">Polishing The Experience</h1>
      <p class="text-xs text-stone-550 dark:text-stone-400 max-w-sm mx-auto leading-relaxed">
        We are refreshing a few details behind the scenes. Appointment requests are still open while the sanctuary is being refined.
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="#booking-modal" data-booking-trigger class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-brand-gold to-brand-goldDark text-white font-semibold rounded-full hover:shadow-lg hover:scale-105 transition-all text-xs">Book Now</a>
      <a href="index.html" class="w-full sm:w-auto px-8 py-3.5 border border-brand-gold text-brand-gold font-semibold rounded-full hover:bg-brand-gold hover:text-white transition-all text-xs">Return Home</a>
    </div>
  </div>

  <p class="utility-footer absolute bottom-6 left-1/2 -translate-x-1/2 z-10 text-[10px] text-white/55 text-center w-full px-6">&copy; 2026 NOVA Salon. All rights reserved.</p>

  <!-- JS Dependencies -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/booking.js"></script>
</body>
</html>
