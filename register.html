<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>Register - NOVA Salon & Spa</title>
  
  <!-- CSS Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            stone: {
              150: '#E7E5E4',
              350: '#A8A29E',
              450: '#78716C',
              455: '#78716C',
              550: '#57534E',
              850: '#1C1917',
              855: '#1C1917'
            },
            brand: {
              gold: '#D4AF37',
              goldDark: '#AA8C2C',
              rose: '#D9A38F',
              roseDark: '#B76E79',
              cream: '#FDFBF7',
              creamDark: '#F5EFE6',
              darkBg: '#0F0F11',
              darkCard: '#1A1A1F',
              darkBorder: 'rgba(255,255,255,.08)',
              darkText: '#A1A1AA'
            }
          },
          screens: { lg: '992px' },
          zIndex: { 60: '60' },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-brand-cream text-stone-850 dark:bg-brand-darkBg dark:text-brand-darkText font-sans transition-colors duration-300 min-h-screen flex items-center justify-center relative px-4 sm:px-6 py-24">
  
  <!-- Background Image Overlay -->
  <div class="absolute inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&q=80&w=1920" class="absolute inset-0 w-full h-full object-cover" alt="Register Background">
    <div class="absolute inset-0 bg-stone-950/70 dark:bg-stone-950/80"></div>
  </div>

  <div class="utility-controlbar absolute top-6 right-4 sm:right-8 z-10 flex items-center gap-2">
    <button type="button" class="theme-toggle w-10 h-10 rounded-full bg-brand-gold hover:bg-brand-goldDark text-stone-950 flex items-center justify-center transition-all" aria-label="Toggle Theme">
      <i class="fa-solid fa-moon dark:hidden text-sm"></i>
      <i class="fa-solid fa-sun hidden dark:block text-sm"></i>
    </button>
    <button type="button" class="rtl-ltr-toggle h-10 px-3 border border-white/20 text-white hover:border-brand-gold hover:text-brand-gold rounded-full text-[10px] font-semibold uppercase tracking-wider flex items-center gap-1.5 transition-all" aria-label="Toggle Direction">
      <i class="fa-solid fa-right-left text-xs"></i> <span class="dir-text">LTR</span>
    </button>
  </div>

  <!-- Register Card (Glassmorphic) -->
  <div class="auth-card relative z-10 max-w-md w-full glass-light dark:glass-dark rounded-3xl p-8 shadow-2xl space-y-6 text-stone-800 dark:text-brand-darkText" data-aos="fade-up">
    <!-- Header -->
    <div class="text-center space-y-2">
      <a href="index.html" class="font-serif text-3xl font-bold tracking-widest text-brand-gold"><i class="fa-solid fa-scissors text-xl mr-2" aria-hidden="true"></i>NOVA Salon</a>
      <h2 class="font-serif text-xl font-bold text-stone-900 dark:text-white">Create Account</h2>
      <p class="text-xs text-stone-500 dark:text-stone-400">Sign up to book appointments and earn loyalty rewards.</p>
    </div>

    <!-- Form -->
    <form id="register-form" class="space-y-4">
      
      <!-- Profile Image Upload UI -->
      <div class="flex flex-col items-center space-y-2">
        <label class="block text-[10px] uppercase tracking-wider font-semibold text-stone-500">Avatar Image</label>
        <div class="relative w-24 h-24 rounded-full border border-stone-200 dark:border-brand-darkBorder overflow-hidden bg-stone-50 dark:bg-brand-darkBg flex items-center justify-center cursor-pointer group shadow">
          <input type="file" id="avatar-upload" name="avatar" accept="image/*" aria-label="Upload avatar image" class="absolute inset-0 opacity-0 cursor-pointer z-10">
          <img id="avatar-preview" src="" class="hidden w-full h-full object-cover absolute inset-0 z-0" alt="Avatar preview">
          <div id="avatar-placeholder" class="text-center text-stone-455 space-y-1">
            <i class="fa-solid fa-camera text-2xl text-stone-400"></i>
            <span class="block text-[8px] text-stone-450 uppercase font-bold text-stone-400">Upload</span>
          </div>
        </div>
      </div>

      <div>
        <label for="register-full-name" class="block text-[10px] uppercase tracking-wider font-semibold text-stone-500 mb-1.5">Full Name</label>
        <div class="relative">
          <input id="register-full-name" name="fullName" type="text" placeholder="John Doe" required autocomplete="name" minlength="2" maxlength="70" class="w-full pl-10 pr-4 py-3 bg-white/70 dark:bg-brand-darkBg/60 border border-stone-200 dark:border-brand-darkBorder rounded-xl focus:border-brand-gold focus:outline-none dark:text-white text-xs">
          <i class="fa-regular fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
        </div>
      </div>

      <div>
        <label for="register-username" class="block text-[10px] uppercase tracking-wider font-semibold text-stone-500 mb-1.5">Username</label>
        <div class="relative">
          <input id="register-username" name="username" type="text" placeholder="nova_guest" required autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" class="w-full pl-10 pr-4 py-3 bg-white/70 dark:bg-brand-darkBg/60 border border-stone-200 dark:border-brand-darkBorder rounded-xl focus:border-brand-gold focus:outline-none dark:text-white text-xs">
          <i class="fa-solid fa-at absolute left-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
        </div>
      </div>

      <div>
        <label for="register-email" class="block text-[10px] uppercase tracking-wider font-semibold text-stone-500 mb-1.5">Email Address</label>
        <div class="relative">
          <input id="register-email" name="email" type="email" placeholder="email@example.com" required autocomplete="email" maxlength="80" class="w-full pl-10 pr-4 py-3 bg-white/70 dark:bg-brand-darkBg/60 border border-stone-200 dark:border-brand-darkBorder rounded-xl focus:border-brand-gold focus:outline-none dark:text-white text-xs">
          <i class="fa-regular fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
        </div>
      </div>

      <div>
        <label for="register-phone" class="block text-[10px] uppercase tracking-wider font-semibold text-stone-500 mb-1.5">Phone Number</label>
        <div class="relative">
          <input id="register-phone" name="phone" type="tel" placeholder="+1 (555) 000-0000" required autocomplete="tel" minlength="7" maxlength="20" class="w-full pl-10 pr-4 py-3 bg-white/70 dark:bg-brand-darkBg/60 border border-stone-200 dark:border-brand-darkBorder rounded-xl focus:border-brand-gold focus:outline-none dark:text-white text-xs">
          <i class="fa-solid fa-phone absolute left-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
        </div>
      </div>

      <div>
        <label for="password-input" class="block text-[10px] uppercase tracking-wider font-semibold text-stone-500 mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="password-input" name="password" placeholder="Password" required autocomplete="new-password" minlength="8" maxlength="72" class="w-full pl-10 pr-4 py-3 bg-white/70 dark:bg-brand-darkBg/60 border border-stone-200 dark:border-brand-darkBorder rounded-xl focus:border-brand-gold focus:outline-none dark:text-white text-xs">
          <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
        </div>
        <!-- Password strength bar -->
        <div class="mt-2 space-y-1">
          <div class="flex gap-1 h-1.5 w-full rounded-full overflow-hidden bg-stone-200 dark:bg-stone-850">
            <div id="strength-bar-1" class="h-full w-1/3 bg-transparent transition-colors duration-200"></div>
            <div id="strength-bar-2" class="h-full w-1/3 bg-transparent transition-colors duration-200"></div>
            <div id="strength-bar-3" class="h-full w-1/3 bg-transparent transition-colors duration-200"></div>
          </div>
          <div class="flex justify-between items-center text-[9px] font-bold text-stone-400">
            <span>Strength:</span>
            <span id="strength-label">None</span>
          </div>
        </div>
      </div>

      <div>
        <label for="register-confirm-password" class="block text-[10px] uppercase tracking-wider font-semibold text-stone-500 mb-1.5">Confirm Password</label>
        <div class="relative">
          <input id="register-confirm-password" name="confirmPassword" type="password" placeholder="Confirm password" required autocomplete="new-password" minlength="8" maxlength="72" class="w-full pl-10 pr-4 py-3 bg-white/70 dark:bg-brand-darkBg/60 border border-stone-200 dark:border-brand-darkBorder rounded-xl focus:border-brand-gold focus:outline-none dark:text-white text-xs">
          <i class="fa-solid fa-shield-halved absolute left-4 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
        </div>
      </div>

      <div class="flex items-start gap-2 text-xs pt-2">
        <input id="register-terms" name="terms" type="checkbox" required class="w-4 h-4 rounded text-brand-gold focus:ring-brand-gold border-stone-300 dark:border-brand-darkBorder dark:bg-brand-darkBg/80 mt-0.5">
        <label for="register-terms" class="text-stone-500 leading-snug">I accept the <a href="#" class="text-brand-gold hover:underline">Terms & Conditions</a> and consent to appointment reminders and loyalty reward updates.</label>
      </div>

      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-brand-gold to-brand-goldDark text-white font-semibold rounded-xl hover:shadow-lg transition-all text-xs mt-2">Create Account</button>
    </form>

    <!-- Return to log in -->
    <div class="text-center text-xs">
      <span class="text-stone-500">Already registered?</span>
      <a href="login.html" class="text-brand-gold font-bold hover:underline ml-1">Log In</a>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/booking.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Profile avatar preview logic
      const uploadInput = document.getElementById('avatar-upload');
      const previewImg = document.getElementById('avatar-preview');
      const placeholder = document.getElementById('avatar-placeholder');

      if (uploadInput) uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            previewImg.src = event.target.result;
            previewImg.classList.remove('hidden');
            placeholder.classList.add('hidden');
          };
          reader.readAsDataURL(file);
        }
      });

      // Password strength meter logic
      const passwordInput = document.getElementById('password-input');
      const bar1 = document.getElementById('strength-bar-1');
      const bar2 = document.getElementById('strength-bar-2');
      const bar3 = document.getElementById('strength-bar-3');
      const label = document.getElementById('strength-label');

      if (passwordInput) passwordInput.addEventListener('input', () => {
        const value = passwordInput.value;
        let score = 0;

        if (value.length >= 8) score++;
        if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;
        if (/[0-9]/.test(value) && /[^A-Za-z0-9]/.test(value)) score++;

        // Reset
        bar1.className = 'h-full w-1/3 bg-transparent transition-colors duration-200';
        bar2.className = 'h-full w-1/3 bg-transparent transition-colors duration-200';
        bar3.className = 'h-full w-1/3 bg-transparent transition-colors duration-200';

        if (value.length === 0) {
          label.innerText = 'None';
          label.className = 'text-stone-400 font-bold';
        } else if (score === 1) {
          bar1.classList.add('bg-red-500');
          label.innerText = 'Weak';
          label.className = 'text-red-500 font-bold';
        } else if (score === 2) {
          bar1.classList.add('bg-yellow-500');
          bar2.classList.add('bg-yellow-500');
          label.innerText = 'Medium';
          label.className = 'text-yellow-500 font-bold';
        } else if (score === 3) {
          bar1.classList.add('bg-emerald-500');
          bar2.classList.add('bg-emerald-500');
          bar3.classList.add('bg-emerald-500');
          label.innerText = 'Strong';
          label.className = 'text-emerald-500 font-bold';
        }
      });
    });
  </script>
</body>
</html>
